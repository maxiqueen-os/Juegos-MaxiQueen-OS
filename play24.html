<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MaxiQueen OS - Módulo de Gamificación</title>
    <style>
        :root {
            --mq-yellow: #FFD700;
            --mq-blue: #0052FF;
            --mq-red: #FF2B2B;
            --bg-dark: #09090b;
            --zinc-800: #27272a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: #f4f4f5;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .os-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            justify-content: space-between;
            background: linear-gradient(180deg, #09090b 0%, #111115 100%);
        }

        .adsense-slot {
            width: 100%;
            height: 50px;
            background-color: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #52525b;
            text-transform: uppercase;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .game-header {
            text-align: center;
            padding: 12px 0;
            border-b: 1px solid rgba(255, 255, 255, 0.05);
        }

        .game-header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .game-header h1 span {
            color: var(--mq-yellow);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 8px;
            font-size: 14px;
            font-family: monospace;
        }

        .stat-score { color: #a1a1aa; }
        .stat-score span { color: #fff; font-weight: bold; }
        .stat-orbs { color: var(--mq-yellow); font-weight: bold; }
        .stat-record { color: #61dafb; }

        .canvas-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
            background: #0c0c0e;
        }

        canvas {
            background-color: #0e0e11;
            border-bottom: 3px solid var(--mq-red);
            border-top: 3px solid var(--mq-blue);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            max-width: 100%;
            max-height: 100%;
        }

        .mobile-controls {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            gap: 12px;
            flex-shrink: 0;
            background: rgba(0,0,0,0.2);
        }

        .control-btn {
            background-color: #18181b;
            color: white;
            border: 1px solid var(--zinc-800);
            border-radius: 12px;
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
            flex-grow: 1;
            user-select: none;
            cursor: pointer;
            transition: background 0.1s, transform 0.05s;
            box-shadow: 0 4px 0px #09090b;
        }

        .control-btn:active {
            transform: translateY(2px);
            background-color: #27272a;
            box-shadow: 0 2px 0px #09090b;
        }

        #btnJump {
            background: linear-gradient(135deg, var(--mq-blue) 0%, #003bb5 100%);
            border: none;
            flex-grow: 2;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            box-shadow: 0 4px 0px #002266;
        }
        
        #btnJump:active {
            box-shadow: 0 2px 0px #002266;
        }

        #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(9, 9, 11, 0.95);
            padding: 30px;
            border: 2px solid var(--mq-yellow);
            border-radius: 16px;
            text-align: center;
            display: none;
            width: 75%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        #gameOverScreen h2 {
            color: var(--mq-red);
            margin-top: 0;
            font-size: 24px;
            letter-spacing: 1px;
            font-weight: 900;
        }

        #btnRestart {
            margin-top: 20px;
            padding: 12px 28px;
            background: var(--mq-yellow);
            color: #000;
            border: none;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            transition: background 0.2s;
        }

        #btnRestart:hover {
            background: #e6c200;
        }
    </style>
</head>
<body>

<div class="os-container">
    <div class="adsense-slot">MaxiQueen OS Engine — H5.Top.Banner</div>

    <div class="game-header">
        <h1>MaxiQueen <span>Run v2</span></h1>
        <div class="stats">
            <div class="stat-score">Metros: <span id="scoreVal">0</span></div>
            <div class="stat-orbs">Orbes: <span id="orbVal">0</span></div>
            <div class="stat-record">Record: <span id="recordVal">0</span></div>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="gameCanvas" width="400" height="480"></canvas>
        
        <div id="gameOverScreen">
            <h2>SISTEMA CAÍDO</h2>
            <p style="color:#a1a1aa; font-size:14px; margin:4px 0;">Diagnóstico técnico de colisión</p>
            <div style="margin: 20px 0; font-family:monospace; font-size:16px;">
                <p style="margin:5px 0;">Distancia: <span id="finalScore" style="color:#fff; font-weight:bold;">0</span> m</p>
                <p style="margin:5px 0;">Capital Orbes: <span id="finalOrbs" style="color:var(--mq-yellow); font-weight:bold;">0</span></p>
            </div>
            <button id="btnRestart" onclick="resetGame()">Reiniciar Módulo</button>
        </div>
    </div>

    <div class="mobile-controls">
        <button class="control-btn" id="btnLeft">◀</button>
        <button class="control-btn" id="btnJump">SALTAR</button>
        <button class="control-btn" id="btnRight">▶</button>
    </div>

    <div class="adsense-slot">MaxiQueen OS Engine — H5.Bottom.Banner</div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreDisplay = document.getElementById('scoreVal');
    const orbDisplay = document.getElementById('orbVal');
    const recordDisplay = document.getElementById('recordVal');
    const gameOverScreen = document.getElementById('gameOverScreen');

    // Configuración Base de Entorno
    const GRAVITY = 0.55;
    const GAME_SPEED_BASE = 3.5;
    let gameSpeed = GAME_SPEED_BASE;
    let score = 0;
    let orbsCollected = 0;
    let highscore = localStorage.getItem('mq_highscore') || 0;
    let isGameOver = false;
    let isFirstStart = true;
    let animationId;
    let bgScrollX = 0;

    recordDisplay.innerText = highscore;

    const COLOR_YELLOW = '#FFD700';
    const COLOR_BLUE = '#0052FF';
    const COLOR_RED = '#FF2B2B';

    // Motor de Audio Nativo (Web Audio API)
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'jump') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
        } else if (type === 'orb') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now); // Nota C5
            osc.frequency.setValueAtTime(659.25, now + 0.08); // Nota E5
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'gameover') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(60, now + 0.4);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        }
    }

    // Motor de Voz Integrado (Web Speech API)
    function systemSpeak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Detiene lecturas previas en cola
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = 1.1; 
            utterance.pitch = 1.0; 
            window.speechSynthesis.speak(utterance);
        }
    }

    // Estructuras de Entidades
    const player = {
        x: 60,
        y: 200,
        width: 28,
        height: 28,
        vy: 0,
        speed: 4.5,
        jumpPower: -10.5,
        isGrounded: false,
        angle: 0
    };

    let platforms = [];
    let orbs = [];
    let particles = [];

    const keys = { left: false, right: false };

    function createParticles(x, y, color) {
        for (let i = 0; i < 8; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                radius: Math.random() * 3 + 1,
                alpha: 1,
                color: color
            });
        }
    }

    function initPlatforms() {
        platforms = [];
        // Muelle de salida extendido
        platforms.push({ x: 0, y: canvas.height - 50, width: canvas.width * 1.8, height: 50 });
    }

    function resetGame() {
        initAudio();
        
        player.x = 60;
        player.y = 150;
        player.vy = 0;
        player.angle = 0;
        score = 0;
        orbsCollected = 0;
        gameSpeed = GAME_SPEED_BASE;
        isGameOver = false;
        orbs = [];
        particles = [];
        
        initPlatforms();
        gameOverScreen.style.display = 'none';
        
        if (isFirstStart) {
            systemSpeak("Módulo de gamificación activo. Operación MaxiQueen iniciada.");
            isFirstStart = false;
        } else {
            systemSpeak("Reiniciando arquitectura base.");
        }

        cancelAnimationFrame(animationId);
        gameLoop();
    }

    function spawnPlatform() {
        const lastP = platforms[platforms.length - 1];
        if (!lastP) return;

        const minGap = 75;
        const maxGap = 150;
        const gap = Math.random() * (maxGap - minGap) + minGap;
        
        const newX = lastP.x + lastP.width + gap;
        const minHeight = canvas.height - 160;
        const maxHeight = canvas.height - 50;
        const newY = Math.random() * (maxHeight - minHeight) + minHeight;
        const newWidth = Math.random() * 120 + 90;

        platforms.push({ x: newX, y: newY, width: newWidth, height: 16 });

        // Probabilidades de Orbes
        if (Math.random() > 0.35) {
            orbs.push({
                x: newX + newWidth / 2,
                y: newY - 35,
                radius: 8,
                active: true,
                pulse: 0
            });
        }
    }

    function update() {
        if (isGameOver) return;

        // Movimiento Horizontal Dinámico
        if (keys.left) player.x -= player.speed;
        if (keys.right) player.x += player.speed;

        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

        // Gravedad y Cinemática
        player.vy += GRAVITY;
        player.y += player.vy;
        player.isGrounded = false;

        // Rotación de renderizado basado en velocidad aérea
        if (!player.isGrounded) {
            player.angle += 0.05;
        } else {
            player.angle = 0;
        }

        // Scroll de fondo técnico
        bgScrollX = (bgScrollX - gameSpeed * 0.3) % 40;

        // Actualización de Plataformas
        platforms.forEach(p => {
            p.x -= gameSpeed;

            // Colisión AABB desde arriba
            if (player.vy > 0 &&
                player.x + player.width > p.x &&
                player.x < p.x + p.width &&
                player.y + player.height >= p.y &&
                player.y + player.height <= p.y + p.height + player.vy) {
                
                player.isGrounded = true;
                player.vy = 0;
                player.y = p.y - player.height;
            }
        });

        // Limpieza de memoria (Entidades fuera de entorno)
        if (platforms.length > 0 && platforms[0].x + platforms[0].width < 0) {
            platforms.shift();
        }
        if (platforms.length === 0 || platforms[platforms.length - 1].x < canvas.width + 200) {
            spawnPlatform();
        }

        // Simulación de Orbes de Energía
        orbs.forEach(orb => {
            orb.x -= gameSpeed;
            orb.pulse += 0.1;

            if (orb.active) {
                const px = player.x + player.width / 2;
                const py = player.y + player.height / 2;
                const dist = Math.hypot(orb.x - px, orb.y - py);

                if (dist < orb.radius + player.width / 2) {
                    orb.active = false;
                    orbsCollected++;
                    score += 30;
                    playSound('orb');
                    createParticles(orb.x, orb.y, COLOR_YELLOW);
                    
                    // Notificación de voz por rendimiento cada 10 orbes
                    if (orbsCollected % 10 === 0) {
                        systemSpeak(`Ingresos optimizados. Diez orbes acumulados.`);
                    }
                }
            }
        });
        orbs = orbs.filter(orb => orb.x + orb.radius > 0 && orb.active);

        // Sistema de Partículas Efímeras
        particles.forEach((p, index) => {
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.03;
            if (p.alpha <= 0) particles.splice(index, 1);
        });

        // Progresión de Datos Matemáticos
        score += 0.08;
        gameSpeed += 0.0006;

        scoreDisplay.innerText = Math.floor(score);
        orbDisplay.innerText = orbsCollected;

        // Control de Fuera de Límites (Caída de Infraestructura)
        if (player.y > canvas.height) {
            triggerGameOver();
        }
    }

    function jump() {
        initAudio();
        if (player.isGrounded && !isGameOver) {
            player.vy = player.jumpPower;
            player.isGrounded = false;
            playSound('jump');
        }
    }

    function triggerGameOver() {
        isGameOver = true;
        playSound('gameover');
        createParticles(player.x + player.width/2, canvas.height - 10, COLOR_RED);
        
        const finalScoreCalculated = Math.floor(score);
        if (finalScoreCalculated > highscore) {
            highscore = finalScoreCalculated;
            localStorage.setItem('mq_highscore', highscore);
            recordDisplay.innerText = highscore;
            systemSpeak("Alerta. Nuevo récord del sistema registrado.");
        } else {
            systemSpeak("Alerta. Sistema caído. Flujo de ventas interrumpido.");
        }

        document.getElementById('finalScore').innerText = finalScoreCalculated;
        document.getElementById('finalOrbs').innerText = orbsCollected;
        gameOverScreen.style.display = 'block';
    }

    // Renderizado Gráfico Vectorial Pure JS
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Dibujar Rejilla de Fondo (Malla Cyberpunk)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
        ctx.lineWidth = 1;
        for (let x = bgScrollX; x < canvas.width; x += 40) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 40) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }

        // 2. Dibujar Plataformas (Nodos Estructurales)
        platforms.forEach(p => {
            ctx.fillStyle = COLOR_BLUE;
            ctx.fillRect(p.x, p.y, p.width, p.height);
            
            // Línea superior de datos neon
            ctx.fillStyle = '#61dafb';
            ctx.fillRect(p.x, p.y, p.width, 2);
        });

        // 3. Dibujar Orbes (Monetización)
        orbs.forEach(orb => {
            const sizeBonus = Math.sin(orb.pulse) * 1.5;
            ctx.beginPath();
            ctx.arc(orb.x, orb.y, orb.radius + sizeBonus, 0, Math.PI * 2);
            ctx.fillStyle = COLOR_YELLOW;
            ctx.shadowBlur = 12;
            ctx.shadowColor = COLOR_YELLOW;
            ctx.fill();
            ctx.shadowBlur = 0; // Reset
            ctx.closePath();
        });

        // 4. Dibujar Partículas
        particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        // 5. Dibujar Jugador (Núcleo de Datos)
        if (!isGameOver) {
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            ctx.rotate(player.angle);
            
            // Cuerpo Base
            ctx.fillStyle = COLOR_RED;
            ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
            
            // Indicador de Dirección Técnico
            ctx.fillStyle = '#fff';
            ctx.fillRect(player.width / 4, -player.height / 4, 6, 6);
            ctx.restore();
        }
    }

    function gameLoop() {
        update();
        draw();
        if (!isGameOver) {
            animationId = requestAnimationFrame(gameLoop);
        }
    }

    // Adaptación Transversal de Eventos Input
    window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') jump();
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    });

    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnJump = document.getElementById('btnJump');

    const addHoldEvent = (element, keyName) => {
        element.addEventListener('mousedown', (e) => { e.preventDefault(); keys[keyName] = true; });
        element.addEventListener('mouseup', (e) => { e.preventDefault(); keys[keyName] = false; });
        element.addEventListener('mouseleave', (e) => { e.preventDefault(); keys[keyName] = false; });
        element.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
        element.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
    };

    addHoldEvent(btnLeft, 'left');
    addHoldEvent(btnRight, 'right');

    btnJump.addEventListener('mousedown', (e) => { e.preventDefault(); jump(); });
    btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });

    // Inicio Forzado
    resetGame();
</script>
</body>
</html>
