<!DOCTYPE html>
<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUDOKU MAXIQUEEN PRO 👑</title>
    <style>
        :root {
            --bg: #0b0f1a;
            --surface: #161b2a;
            --primary: #7c3aed;
            --secondary: #374151;
            --accent: #10b981;
            --error: #ef4444;
            --text: #ffffff;
            --border: #2d3748;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin: 10px 0;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: var(--surface);
            border-radius: 12px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* Controles de Voz Sutiles */
        .voice-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid rgba(124, 58, 237, 0.3);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }

        .voice-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .voice-btn:hover {
            background: #6d28d9;
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.5);
        }

        /* El Tablero */
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            border: 3px solid var(--text);
            background: var(--text);
            gap: 1px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            aspect-ratio: 1;
        }

        .cell {
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s;
            user-select: none;
            position: relative;
        }

        /* Bordes de bloques 3x3 */
        .cell:nth-child(3n) { border-right: 2px solid var(--text); }
        .cell:nth-child(9n) { border-right: none; }
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--text); }

        .cell.fixed { background: #1f2937; font-weight: 800; color: #9ca3af; }
        .cell.selected { background: var(--primary) !important; color: white; }
        .cell.related { background: #1e293b; }
        .cell.error { color: var(--error); animation: shake 0.2s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        /* Teclado */
        .numpad {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 20px;
        }

        .num-btn {
            padding: 12px;
            background: var(--secondary);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .num-btn:active { transform: scale(0.9); background: var(--primary); }

        .difficulty-btns {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-top: 15px;
        }

        .btn-sm {
            padding: 8px;
            font-size: 0.8rem;
            background: #1f2937;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #ccc;
            cursor: pointer;
        }

        .btn-sm.active { background: var(--primary); color: white; }

        #status-msg {
            text-align: center;
            margin-top: 10px;
            font-size: 0.9rem;
            height: 20px;
        }

        /* Estilos Hub de Navegación */
        .os-navigation-hub {
            margin-top: 30px;
            padding: 15px;
            background: #111625;
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .hub-title {
            font-size: 0.9rem;
            letter-spacing: 1px;
            color: #a855f7;
            margin-bottom: 12px;
            text-align: center;
        }

        .hub-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .hub-card {
            display: flex;
            align-items: center;
            background: var(--surface);
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .hub-card:hover {
            border-color: var(--primary);
            background: #1e2538;
        }

        .card-id {
            background: var(--primary);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-right: 10px;
        }

        .card-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-name {
            font-size: 0.9rem;
            font-weight: bold;
        }

        .card-status {
            font-size: 0.7rem;
            color: #9ca3af;
        }

        .card-arrow {
            font-weight: bold;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>SUDOKU MAXIQUEEN PRO 👑</h1>

    <div class="stats-bar">
        <span id="timer">⏱️ 00:00</span>
        <span id="difficulty-label">Nivel: -</span>
        <span id="lives">❤️ 3</span>
    </div>

    <div class="voice-bar">
        <span>🎙️ Asistente de Voz Activo</span>
        <button class="voice-btn" onclick="readCurrentStatus()">🔊 Leer Estado</button>
    </div>

    <div id="grid" class="sudoku-grid"></div>

    <div class="numpad">
        <button class="num-btn" onclick="inputValue(1)">1</button>
        <button class="num-btn" onclick="inputValue(2)">2</button>
        <button class="num-btn" onclick="inputValue(3)">3</button>
        <button class="num-btn" onclick="inputValue(4)">4</button>
        <button class="num-btn" onclick="inputValue(5)">5</button>
        <button class="num-btn" onclick="inputValue(6)">6</button>
        <button class="num-btn" onclick="inputValue(7)">7</button>
        <button class="num-btn" onclick="inputValue(8)">8</button>
        <button class="num-btn" onclick="inputValue(9)">9</button>
        <button class="num-btn" style="background:#4b5563" onclick="inputValue(0)">⌫</button>
    </div>

    <div class="difficulty-btns">
        <button class="btn-sm" onclick="newGame('easy')">Fácil</button>
        <button class="btn-sm" onclick="newGame('medium')">Medio</button>
        <button class="btn-sm" onclick="newGame('hard')">Difícil</button>
        <button class="btn-sm" onclick="newGame('expert')">Experto</button>
        <button class="btn-sm" onclick="newGame('extreme')">Extremo</button>
        <button class="btn-sm" onclick="solveGame()">Resolver</button>
    </div>

    <div id="status-msg">Selecciona un nivel para empezar</div>
</div>

<script>
    let solution = [];
    let currentBoard = [];
    let selectedCell = null;
    let lives = 3;
    let seconds = 0;
    let timerInt;
    let currentLevelName = "-";

    const gridEl = document.getElementById('grid');

    // CONFIGURACIÓN DE VOZ NATIVA DE MAXIQUEEN OS
    function speakOS(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Detiene lecturas previas para evitar retrasos
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = 1.0; 
            utterance.pitch = 1.0;
            
            // Intenta seleccionar una voz en español estable
            const voices = window.speechSynthesis.getVoices();
            const esVoice = voices.find(v => v.lang.includes('es'));
            if (esVoice) utterance.voice = esVoice;

            window.speechSynthesis.speak(utterance);
        }
    }

    function readCurrentStatus() {
        let min = Math.floor(seconds / 60);
        let seg = seconds % 60;
        let msg = `Estado del juego. Nivel ${currentLevelName}. Te quedan ${lives} vidas, y llevas un tiempo de ${min} minutos con ${seg} segundos.`;
        if(currentLevelName === "-") {
            msg = "El juego no ha comenzado. Selecciona un nivel de dificultad para iniciar.";
        }
        speakOS(msg);
    }

    // Inicializar rejilla vacía
    function initGrid() {
        gridEl.innerHTML = '';
        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.dataset.index = i;
            cell.addEventListener('click', () => selectCell(i));
            gridEl.appendChild(cell);
        }
    }

    function selectCell(index) {
        const cells = document.querySelectorAll('.cell');
        cells.forEach(c => c.classList.remove('selected', 'related'));
        
        selectedCell = index;
        const row = Math.floor(index / 9);
        const col = index % 9;

        cells.forEach((c, i) => {
            const r = Math.floor(i / 9);
            const _c = i % 9;
            if (r === row || _c === col) c.classList.add('related');
        });

        cells[index].classList.add('selected');
    }

    function generateSudoku() {
        let b = Array(81).fill(0);
        
        function isValid(board, r, c, n) {
            for (let i = 0; i < 9; i++) {
                if (board[r * 9 + i] === n || board[i * 9 + c] === n) return false;
            }
            let startR = Math.floor(r / 3) * 3;
            let startC = Math.floor(c / 3) * 3;
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    if (board[(startR + i) * 9 + (startC + j)] === n) return false;
                }
            }
            return true;
        }

        function solve(board) {
            for (let i = 0; i < 81; i++) {
                if (board[i] === 0) {
                    let nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
                    for (let n of nums) {
                        if (isValid(board, Math.floor(i/9), i%9, n)) {
                            board[i] = n;
                            if (solve(board)) return true;
                            board[i] = 0;
                        }
                    }
                    return false;
                }
            }
            return true;
        }
        solve(b);
        return b;
    }

    function newGame(level) {
        clearInterval(timerInt);
        seconds = 0;
        lives = 3;
        currentLevelName = level.toUpperCase();
        document.getElementById('lives').textContent = "❤️ " + lives;
        document.getElementById('difficulty-label').textContent = "Nivel: " + currentLevelName;
        
        solution = generateSudoku();
        const counts = { easy: 35, medium: 45, hard: 52, expert: 58, extreme: 64 };
        let puzzle = [...solution];
        let toRemove = counts[level];
        
        while (toRemove > 0) {
            let idx = Math.floor(Math.random() * 81);
            if (puzzle[idx] !== 0) {
                puzzle[idx] = 0;
                toRemove--;
            }
        }

        const cells = document.querySelectorAll('.cell');
        cells.forEach((cell, i) => {
            cell.classList.remove('fixed', 'error', 'selected', 'related');
            cell.style.color = ""; 
            cell.textContent = puzzle[i] !== 0 ? puzzle[i] : '';
            if (puzzle[i] !== 0) cell.classList.add('fixed');
        });

        timerInt = setInterval(() => {
            seconds++;
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `⏱️ ${m}:${s}`;
        }, 1000);
        
        document.getElementById('status-msg').textContent = "¡Buena suerte!";
        speakOS(`Iniciando nueva partida en nivel ${level}. ¡Buena suerte!`);
    }

    function inputValue(num) {
        if (selectedCell === null) return;
        const cell = document.querySelectorAll('.cell')[selectedCell];
        if (cell.classList.contains('fixed') || lives <= 0) return;

        if (num === 0) { // Borrar
            cell.textContent = '';
            cell.classList.remove('error');
            return;
        }

        cell.textContent = num;
        if (num !== solution[selectedCell]) {
            cell.classList.add('error');
            lives--;
            document.getElementById('lives').textContent = "❤️ " + lives;
            if (lives <= 0) {
                gameOver(false);
            } else {
                speakOS(`Incorrecto. Te quedan ${lives} vidas.`);
            }
        } else {
            cell.classList.remove('error');
            checkWin();
        }
    }

    function checkWin() {
        const cells = document.querySelectorAll('.cell');
        let complete = true;
        cells.forEach((c, i) => {
            if (parseInt(c.textContent) !== solution[i]) complete = false;
        });
        if (complete) gameOver(true);
    }

    function gameOver(win) {
        clearInterval(timerInt);
        const finalMsg = win ? "🏆 ¡ERES UN PRO!" : "💀 JUEGO TERMINADO";
        document.getElementById('status-msg').textContent = finalMsg;
        
        if (win) {
            speakOS("¡Felicitaciones! Has completado el tablero con éxito. Eres un verdadero profesional.");
        } else {
            speakOS("Juego terminado. Has agotado todas tus vidas. Cargando solución en pantalla.");
            solveGame();
        }
    }

    // Asegura compatibilidad con voces cargadas asíncronamente en navegadores como Chrome
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = function() {
            // Carga voces preventivamente
        };
    }

    function solveGame() {
        const cells = document.querySelectorAll('.cell');
        cells.forEach((c, i) => {
            c.textContent = solution[i];
            if (!c.classList.contains('fixed')) c.style.color = "var(--accent)";
        });
    }

    // Soporte para teclado físico
    window.addEventListener('keydown', (e) => {
        if (e.key >= 1 && e.key <= 9) inputValue(parseInt(e.key));
        if (e.key === 'Backspace' || e.key === 'Delete') inputValue(0);
    });

    initGrid();
</script>

<div class="os-navigation-hub">
    <h3 class="hub-title">MÓDULOS DE JUEGO DISPONIBLES</h3>
    
    <div class="hub-grid">
        <a href="https://juegos-maxi-queen-os.vercel.app/play8.html" class="hub-card">
            <span class="card-id">MQ-03</span>
            <div class="card-info">
                <span class="card-name">Sudoku_Niv_Tiempo</span>
                <span class="card-status">SUDOKU CORE v4.0.26</span>
            </div>
            <div class="card-arrow">→</div>
        </a>

        <a href="https://juegos-maxi-queen-os.vercel.app/play9.html" class="hub-card">
            <span class="card-id">SQ-05</span>
            <div class="card-info">
                <span class="card-name">Sudoku Pro Suer</span>
                <span class="card-status">Alpha Version</span>
            </div>
            <div class="card-arrow">→</div>
        </a>

        <a href="https://juegos-maxi-queen-os.vercel.app/QueenTower.html" class="hub-card">
            <span class="card-id">SQ-06</span>
            <div class="card-info">
                <span class="card-name">Queen Tower</span>
                <span class="card-status">Beta Release</span>
            </div>
            <div class="card-arrow">→</div>
        </a>
    </div>
</div>

</body>
</html>
