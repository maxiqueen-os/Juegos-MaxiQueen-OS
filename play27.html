<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAXIQUEEN OS • MULTIVERSE RUNNER PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #0066ff; --yellow: #ffcc00; --red: #ff0033; --magenta: #ff00ff; --cyan: #00ffff; --bg: #010409;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Orbitron', sans-serif; 
            overflow: hidden;
            display: flex; flex-direction: column; height: 100vh;
        }

        /* HEADER HUD */
        #hud {
            display: grid; grid-template-columns: repeat(4, 1fr);
            padding: 10px 20px; border-bottom: 2px solid var(--blue);
            background: rgba(0, 0, 0, 0.9); z-index: 100;
            box-shadow: 0 0 15px rgba(0, 102, 255, 0.4);
        }
        .stat { text-align: center; font-size: 0.75rem; letter-spacing: 1px; }
        .stat span { display: block; font-size: 1.1rem; font-weight: 900; color: var(--cyan); }
        .hp-val { color: var(--red) !important; }
        .coin-val { color: var(--yellow) !important; }

        /* GAME AREA */
        #game-wrapper {
            flex-grow: 1; position: relative; background: #000; overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* MOBILE CONTROLS */
        #mobile-controls {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; background: #05050a; height: 140px;
            border-top: 1px solid rgba(0, 102, 255, 0.2);
        }
        .joy-group { display: flex; gap: 20px; }
        .btn-ctrl {
            width: 75px; height: 75px; background: rgba(0, 102, 255, 0.1);
            border: 2px solid var(--blue); border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; color: white; transition: background 0.1s, transform 0.1s;
            box-shadow: 0 0 10px rgba(0, 102, 255, 0.2);
        }
        .btn-jump { 
            width: 95px; height: 95px; border-radius: 50%; 
            background: rgba(255, 204, 0, 0.1); border-color: var(--yellow);
            color: var(--yellow); font-weight: 900; font-size: 1.2rem;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
        }
        .btn-ctrl:active { transform: scale(0.92); background: var(--blue); color: black; }
        .btn-jump:active { background: var(--yellow); color: black; }

        /* OVERLAYS */
        #msg-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.7); pointer-events: auto; z-index: 50;
            transition: opacity 0.5s;
        }
        .menu-title { font-size: 2rem; color: var(--magenta); text-shadow: 0 0 15px var(--magenta); margin-bottom: 5px; text-align: center; }
        .menu-subtitle { font-size: 0.9rem; color: #aaa; margin-bottom: 25px; text-align: center; max-width: 80%; }
        
        .start-btn {
            padding: 15px 40px; font-family: 'Orbitron', sans-serif; font-weight: 900;
            font-size: 1.2rem; background: transparent; border: 2px solid var(--cyan);
            color: var(--cyan); cursor: pointer; border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,255,255,0.3); transition: 0.2s;
        }
        .start-btn:hover { background: var(--cyan); color: black; }

        .level-up { 
            font-size: 2.2rem; color: var(--yellow); text-shadow: 0 0 25px var(--yellow);
            animation: pulse 1s infinite; display: none; font-weight: 900; text-align: center;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(0.95); } }
    </style>
</head>
<body>

<div id="hud">
    <div class="stat">SECTOR <span>0<b id="lvl-ui">1</b></span></div>
    <div class="stat">DISTANCIA <span><b id="dist-ui">0</b>m</span></div>
    <div class="stat">NÚCLEOS <span><b id="coin-ui" class="coin-val">0</b></span></div>
    <div class="stat">SISTEMA <span class="hp-val"><b id="hp-ui">100</b>%</span></div>
</div>

<div id="game-wrapper">
    <div id="msg-overlay">
        <h1 id="main-title" class="menu-title">MAXIQUEEN OS</h1>
        <p id="main-subtitle" class="menu-subtitle">SISTEMA OPERATIVO MULTIVERSAL INTERRUMPIDO.<br>AVANCE HACIA EL NÚCLEO DE LA CORONA.</p>
        <button id="start-btn" class="start-btn">INICIALIZAR</button>
        <div id="level-msg" class="level-up">SECTOR ASEGURADO<br><span style="font-size:1rem; color:#fff;">SALTANDO EN EL ESPACIO-TIEMPO...</span></div>
    </div>
    <canvas id="canvas"></canvas>
</div>

<div id="mobile-controls">
    <div class="joy-group">
        <div class="btn-ctrl" id="leftBtn">◀</div>
        <div class="btn-ctrl" id="rightBtn">▶</div>
    </div>
    <div class="btn-ctrl btn-jump" id="jumpBtn">SALTAR</div>
</div>

<script>
/**
 * MAXIQUEEN ENGINE EVOLUTION v2.5
 * Narración de voz IA incorporada / Generación Procedimental de Estrategia Avanzada
 */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const lvlUI = document.getElementById('lvl-ui');
const distUI = document.getElementById('dist-ui');
const coinUI = document.getElementById('coin-ui');
const hpUI = document.getElementById('hp-ui');
const levelMsg = document.getElementById('level-msg');
const msgOverlay = document.getElementById('msg-overlay');
const startBtn = document.getElementById('start-btn');
const mainTitle = document.getElementById('main-title');
const mainSubtitle = document.getElementById('main-subtitle');

// CONFIGURACIÓN GLOBAL
const TILE_SIZE = 50;
const GRAVITY = 0.55;
const FRICTION = 0.82;

let width, height;
function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = document.getElementById('game-wrapper').clientHeight;
}
window.addEventListener('resize', resize);
resize();

// COLORES CACHEADOS (Previene caídas de rendimiento por llamadas continuas al DOM)
const Colors = {
    blue: '#0066ff', yellow: '#ffcc00', red: '#ff0033', magenta: '#ff00ff', cyan: '#00ffff'
};

// MOTOR DE VOZ INTERACTIVA
const VoiceOS = {
    synth: window.speechSynthesis,
    enabled: true,
    speak(text) {
        if (!this.enabled || !this.synth) return;
        this.synth.cancel(); // Detener transmisiones anteriores inmediatamente
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-MX'; // Español Neutral / Latino de preferencia
        utterance.rate = 1.1; 
        utterance.pitch = 0.9; // Tono cibernético, ligeramente más robótico/seguro
        this.synth.speak(utterance);
    }
};

// ESTADO DEL JUEGO
const Game = {
    running: false,
    lvl: 1,
    coins: 0,
    hp: 100,
    cameraX: 0,
    maxSectors: 5, // Al llegar al final del sector 5, reclama la Corona Maxiqueen
    platforms: [],
    items: [],
    portal: null,
    crown: null,
    distance: 0
};

// JUGADOR
const Player = {
    x: 100, y: 0,
    vx: 0, vy: 0,
    w: 32, h: 48,
    speed: 5.5,
    jumpForce: -13.5,
    grounded: false,
    invulnerable: false,
    
    update() {
        if(!Game.running) return;

        // Controles de movimiento
        if (keys.ArrowLeft || keys.left) this.vx = -this.speed;
        else if (keys.ArrowRight || keys.right) this.vx = this.speed;
        else this.vx *= FRICTION;

        if ((keys.ArrowUp || keys.Space || keys.jump) && this.grounded) {
            this.vy = this.jumpForce;
            this.grounded = false;
        }

        // Aplicación de físicas físicas
        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;

        // Mantener dentro de los límites traseros
        if (this.x < 0) this.x = 0;

        this.grounded = false;
        this.checkCollisions();
        
        // Cámara cinemática adaptativa
        let targetCam = this.x - width / 3;
        Game.cameraX += (targetCam - Game.cameraX) * 0.08;
        if(Game.cameraX < 0) Game.cameraX = 0;

        // Mapear distancia en metros informada en el HUD
        Game.distance = Math.max(Game.distance, Math.floor(this.x / 10));
        distUI.innerText = Game.distance;

        // Abismo (Vacío cuántico)
        if (this.y > height + 200) {
            this.takeDamage(100, "Caída al vacío del multiverso.");
        }
    },

    takeDamage(amount, reason) {
        if(this.invulnerable || Game.hp <= 0) return;
        Game.hp -= amount;
        if(Game.hp < 0) Game.hp = 0;
        hpUI.innerText = Game.hp;

        if(Game.hp <= 0) {
            this.die();
        } else {
            VoiceOS.speak("Alerta. Integridad de software al " + Game.hp + " por ciento.");
            this.invulnerable = true;
            setTimeout(() => this.invulnerable = false, 1000); // 1s de gracia
        }
    },

    checkCollisions() {
        // Colisiones con Plataformas y Obstáculos
        Game.platforms.forEach(p => {
            if (this.x < p.x + p.w && this.x + this.w > p.x &&
                this.y < p.y + p.h && this.y + this.h > p.y) {
                
                if (p.type === 'spike') {
                    this.takeDamage(35, "Infección por código malicioso.");
                    // Pequeño rebote táctico al dañar
                    this.vy = -6;
                    return;
                }

                // Resolver colisión estándar (Bloques sólidas)
                if (this.vy > 0 && this.y + this.h - this.vy <= p.y) {
                    this.y = p.y - this.h;
                    this.vy = 0;
                    this.grounded = true;
                }
                else if (this.vx > 0 && this.x + this.w - this.vx <= p.x) this.x = p.x - this.w;
                else if (this.vx < 0 && this.x - this.vx >= p.x + p.w) this.x = p.x + p.w;
                else if (this.vy < 0) { this.y = p.y + p.h; this.vy = 0; }
            }
        });

        // Absorción de Núcleos de Energía (Items)
        Game.items.forEach((item) => {
            if (!item.collected && this.x < item.x + item.w && this.x + this.w > item.x &&
                this.y < item.y + item.h && this.y + this.h > item.y) {
                item.collected = true;
                Game.coins += 1;
                coinUI.innerText = Game.coins;
                
                // Efecto de audio nativo por síntesis ligero si se requiere, de lo contrario silencioso para fluidez.
                if(Game.coins % 15 === 0) VoiceOS.speak("Sincronizando subnúcleos.");
            }
        });

        // Portal Interdimensional de Sectores
        if (Game.portal && this.x < Game.portal.x + Game.portal.w && this.x + this.w > Game.portal.x &&
            this.y < Game.portal.y + Game.portal.h && this.y + this.h > Game.portal.y) {
            this.nextLevel();
        }

        // Meta Final: La Corona de Maxiqueen OS
        if (Game.crown && this.x < Game.crown.x + Game.crown.w && this.x + this.w > Game.crown.x &&
            this.y < Game.crown.y + Game.crown.h && this.y + this.h > Game.crown.y) {
            this.winGame();
        }
    },

    die() {
        Game.running = false;
        VoiceOS.speak("Fallo crítico del sistema. Maxiqueen OS se está reiniciando.");
        setTimeout(() => location.reload(), 2000);
    },

    nextLevel() {
        Game.running = false;
        Game.portal = null; // Evitar disparos repetidos
        levelMsg.style.display = 'block';
        msgOverlay.style.background = "rgba(0,0,0,0.8)";
        
        Game.lvl++;
        VoiceOS.speak(`Sector ${Game.lvl - 1} purificado. Inicializando Sector ${Game.lvl}.`);
        
        setTimeout(() => {
            levelMsg.style.display = 'none';
            msgOverlay.style.background = "rgba(0,0,0,0.7)";
            lvlUI.innerText = Game.lvl;
            initLevel();
            Game.running = true;
        }, 2200);
    },

    winGame() {
        Game.running = false;
        Game.crown = null;
        mainTitle.innerText = "¡CORONA RECUPERADA!";
        mainTitle.style.color = Colors.yellow;
        mainTitle.style.textShadow = "0 0 30px #ffcc00";
        mainSubtitle.innerHTML = `SISTEMA MAXIQUEEN OS RESTAURADO CON ÉXITO.<br>Núcleos recolectados: ${Game.coins}<br>Distancia recorrida: ${Game.distance} metros.`;
        startBtn.innerText = "VOLVER A JUGAR";
        startBtn.style.borderColor = Colors.yellow;
        startBtn.style.color = Colors.yellow;
        startBtn.onclick = () => location.reload();
        msgOverlay.style.display = "flex";
        
        VoiceOS.speak("Acceso concedido. La Corona ha sido sincronizada con el núcleo central. Larga vida a Maxi Queen O S. Sistema operativo optimizado.");
    },

    draw() {
        ctx.save();
        ctx.translate(-Game.cameraX, 0);
        
        if(this.invulnerable && Math.floor(Date.now() / 100) % 2 === 0) {
            ctx.restore();
            return; // Efecto parpadeo por daño
        }

        // Traje Cyber-Runner
        ctx.fillStyle = Colors.blue;
        ctx.shadowBlur = 15; ctx.shadowColor = Colors.blue;
        ctx.fillRect(this.x, this.y, this.w, this.h);
        
        // Visor Operativo Holográfico
        ctx.fillStyle = Colors.cyan;
        ctx.shadowBlur = 5;
        if(keys.ArrowLeft || keys.left) {
            ctx.fillRect(this.x + 2, this.y + 10, 12, 6);
        } else {
            ctx.fillRect(this.x + this.w - 14, this.y + 10, 12, 6);
        }
        
        ctx.restore();
    }
};

// GENERACIÓN PROCEDIMENTAL AVANZADA (Estrategia y Escalamiento)
const MapGenerators = {
    generate(lvl) {
        // Estructura adaptativa según el nivel actual
        let chunks = ["      ", " 111  "];
        let pool = [
            "  111  ", 
            "  131  ", // Obstáculo en plataforma
            "  1  1  ", // Brecha simple
            "  1 3 1 ", // Brecha con peligro abajo
            " 11 CC 11 ", // Estructura con premios
            " 13331 "  // Zona de salto largo estratégico
        ];

        // Añadir mayor hostilidad según el avance del sector
        if(lvl >= 2) pool.push(" 113311 ", "  1 3 3 1  ");
        if(lvl >= 4) pool.push(" 331133 ", "  1   3   1  ");

        // Construir mapa lineal agregando bloques aleatorios de la piscina
        let length = 8 + (lvl * 4); // El mapa se expande dinámicamente
        if(lvl >= Game.maxSectors) length = 12; // Sector final controlado

        for(let i=0; i < length; i++) {
            let randIndex = Math.floor(Math.random() * pool.length);
            chunks.push(pool[randIndex]);
        }

        // Remate final del sector
        if(lvl === Game.maxSectors) {
            chunks.push("  11111  ", "   W   ", " 1111111 "); // W = Corona Final
        } else {
            chunks.push("  11111  ", "   P   ", " 1111111 "); // P = Portal de Transición
        }

        // Convertir chunks a la matriz bidimensional del mapa real
        let mapWidth = chunks.join("").length;
        let finalMap = [
            " ".repeat(mapWidth), // Fila 0: Vacía para saltos altos
            " ".repeat(mapWidth), // Fila 1: Monedas superiores
            " ".repeat(mapWidth), // Fila 2: Plataformas flotantes intermedias
            "",                   // Fila 3: Base dinámica (Se procesa abajo)
            "1".repeat(mapWidth)  // Fila 4: Base sólida indestructible (con cortes más adelante si se desea)
        ];

        // Inyectar los chunks procesados directamente sobre la línea de acción principal
        finalMap[3] = chunks.join("");
        
        // Colocar monedas dinámicamente arriba de donde haya bloques estables
        let row1 = "";
        for(let c=0; c < finalMap[3].length; c++) {
            if(finalMap[3][c] === '1' && Math.random() < 0.25) {
                row1 += "C";
            } else {
                row1 += " ";
            }
        }
        finalMap[1] = row1;

        return finalMap;
    }
};

function initLevel() {
    Game.platforms = [];
    Game.items = [];
    Game.portal = null;
    Game.crown = null;
    
    // Resetear posición jugador de forma segura
    Player.x = 80; 
    Player.y = height - TILE_SIZE * 3;
    Player.vx = 0; Player.vy = 0;
    
    const map = MapGenerators.generate(Game.lvl);
    
    for (let r = 0; r < map.length; r++) {
        for (let c = 0; c < map[r].length; c++) {
            let char = map[r][c];
            let px = c * TILE_SIZE;
            // Alinear de manera perfecta el mapa al fondo inferior disponible del contenedor
            let py = height - (map.length - r) * TILE_SIZE;

            if (char === '1') Game.platforms.push({ x: px, y: py, w: TILE_SIZE, h: TILE_SIZE, type: 'block' });
            if (char === '3') Game.platforms.push({ x: px, y: py + 22, w: TILE_SIZE, h: 28, type: 'spike' });
            if (char === 'C') Game.items.push({ x: px + 15, y: py + 15, w: 20, h: 20, collected: false });
            if (char === 'P') Game.portal = { x: px + 10, y: py - 40, w: 30, h: 90 };
            if (char === 'W') Game.crown = { x: px, y: py - 50, w: TILE_SIZE, h: 50 };
        }
    }
}

// CAPTURA DE ACCIONES (INPUTS)
const keys = { left: false, right: false, jump: false };
window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;

const bindTouch = (id, key) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; }, {passive: false});
    el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; }, {passive: false});
};
bindTouch('leftBtn', 'left');
bindTouch('rightBtn', 'right');
bindTouch('jumpBtn', 'jump');

// INTERFAZ INICIAL DE USUARIO
startBtn.onclick = () => {
    msgOverlay.style.display = 'none';
    mainTitle.style.display = 'none';
    mainSubtitle.style.display = 'none';
    startBtn.style.display = 'none';
    
    // Desbloquear contexto de voz y arrancar loop principal
    Game.running = true;
    VoiceOS.speak("Sistemas iniciados. Ejecutando Multiverse Runner Pro. Consiga la corona de Maxiqueen OS.");
};

// BUCLE PRINCIPAL DE RENDERIZADO Y FÍSICA
function loop() {
    ctx.clearRect(0, 0, width, height);

    // Fondo Profundo (Estrellas de Parallax de Reducción Computacional)
    ctx.fillStyle = '#060713';
    ctx.fillRect(0, 0, width, height);
    
    ctx.fillStyle = 'rgba(0, 255, 255, 0.4)';
    for(let i=0; i<40; i++) {
        let sx = (i * 190 - Game.cameraX * 0.15) % (width + 50) - 20;
        ctx.fillRect(sx, (i * 23) % height, 2, 2);
    }

    // Dibujar elementos del mapa desplazados por la cámara
    ctx.save();
    ctx.translate(-Game.cameraX, 0);

    // Renderizado de Plataformas / Trampas
    Game.platforms.forEach(p => {
        if(p.type === 'block') {
            ctx.fillStyle = '#051636';
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.strokeStyle = Colors.blue;
            ctx.lineWidth = 2;
            ctx.strokeRect(p.x, p.y, p.w, p.h);
        } else {
            // Diseño de Espinas / Código Infeccioso
            ctx.fillStyle = '#4a0011';
            ctx.fillRect(p.x, p.y, p.w, p.h);
            
            ctx.strokeStyle = Colors.red;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y + p.h);
            ctx.lineTo(p.x + p.w/2, p.y);
            ctx.lineTo(p.x + p.w, p.y + p.h);
            ctx.stroke();
        }
    });

    // Renderizado de Núcleos (Monedas)
    Game.items.forEach(item => {
        if(!item.collected) {
            ctx.fillStyle = Colors.yellow;
            ctx.shadowBlur = 12; ctx.shadowColor = Colors.yellow;
            ctx.beginPath();
            ctx.arc(item.x + item.w/2, item.y + item.h/2, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    });

    // Renderizado de Portal de Sector
    if(Game.portal) {
        let timeFactor = Date.now() * 0.005;
        let pulseW = Game.portal.w + Math.sin(timeFactor) * 4;
        ctx.fillStyle = 'rgba(0, 255, 255, 0.15)';
        ctx.shadowBlur = 20; ctx.shadowColor = Colors.cyan;
        ctx.fillRect(Game.portal.x - (pulseW - Game.portal.w)/2, Game.portal.y, pulseW, Game.portal.h);
        ctx.strokeStyle = Colors.cyan;
        ctx.lineWidth = 3;
        ctx.strokeRect(Game.portal.x - (pulseW - Game.portal.w)/2, Game.portal.y, pulseW, Game.portal.h);
        ctx.shadowBlur = 0;
    }

    // Renderizado de la legendaria CORONA DE MAXIQUEEN OS
    if(Game.crown) {
        ctx.fillStyle = Colors.yellow;
        ctx.shadowBlur = 25; ctx.shadowColor = Colors.yellow;
        
        // Dibujo poligonal de corona de alta gama
        let cx = Game.crown.x;
        let cy = Game.crown.y + 10 + Math.sin(Date.now() * 0.004) * 5; // Flotación elegante
        let cw = Game.crown.w;
        
        ctx.beginPath();
        ctx.moveTo(cx, cy + 40);
        ctx.lineTo(cx + cw, cy + 40);
        ctx.lineTo(cx + cw, cy + 15);
        ctx.lineTo(cx + (cw * 0.75), cy + 28);
        ctx.lineTo(cx + (cw * 0.5), cy + 5); // Pico central
        ctx.lineTo(cx + (cw * 0.25), cy + 28);
        ctx.lineTo(cx, cy + 15);
        ctx.closePath();
        ctx.fill();
        
        // Gema central magenta
        ctx.fillStyle = Colors.magenta;
        ctx.fillRect(cx + cw/2 - 4, cy + 22, 8, 8);
        ctx.shadowBlur = 0;
    }

    ctx.restore();

    // Actualizar ciclo de vida y renderizado de personaje
    Player.update();
    Player.draw();

    requestAnimationFrame(loop);
}

// DISPARO INICIAL
initLevel();
loop();
</script>
</body>
</html>
