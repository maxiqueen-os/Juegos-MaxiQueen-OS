<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MaxiQueen OS - Cyber Mission v2</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ff;
            --ui-bg: rgba(10, 25, 41, 0.85);
            --border-color: #1a3a4a;
        }
        body { 
            margin: 0; 
            background: #050a0f; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Segoe UI', 'Courier New', Courier, monospace;
            color: var(--neon-blue);
            user-select: none;
            touch-action: none;
        }
        #game-container { 
            position: relative; 
            width: 800px; 
            height: 600px; 
            border: 2px solid var(--border-color); 
            box-shadow: 0 0 25px rgba(0,242,255,0.15);
            background: #0d1b2a;
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }

        /* HUD Futurista */
        .hud-panel {
            position: absolute; 
            padding: 12px; 
            background: var(--ui-bg);
            border: 1px solid var(--neon-blue); 
            border-radius: 6px; 
            pointer-events: none;
            box-shadow: inset 0 0 10px rgba(0,242,255,0.1);
        }
        #mission-panel { top: 20px; left: 20px; width: 220px; }
        #health-panel { top: 20px; right: 20px; display: flex; align-items: center; gap: 6px; }
        .battery { width: 14px; height: 24px; border: 2px solid var(--neon-blue); position: relative; border-radius: 2px; }
        .battery.active { background: var(--neon-blue); box-shadow: 0 0 8px var(--neon-blue); }
        
        /* Modulo de interacción por Voz (UI activa) */
        #voice-panel-ui {
            position: absolute;
            top: 85px;
            right: 20px;
            pointer-events: auto;
        }
        .voice-audit-btn {
            background: rgba(255, 0, 255, 0.1);
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 5px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .voice-audit-btn:hover {
            background: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 10px var(--neon-pink);
        }

        /* Controles Táctiles Optimizados para Móvil (Acode) */
        #controls {
            position: absolute; 
            bottom: 25px; 
            width: 100%;
            display: flex; 
            justify-content: space-between; 
            padding: 0 40px; 
            box-sizing: border-box;
            pointer-events: none;
        }
        .btn {
            width: 70px; 
            height: 70px; 
            background: rgba(0,242,255,0.08);
            border: 2px solid var(--neon-blue); 
            border-radius: 50%;
            display: flex; 
            justify-content: center; 
            align-items: center;
            font-weight: bold; 
            font-size: 24px; 
            pointer-events: auto;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.1s;
        }
        .btn:active { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }
        
        /* Overlays para pantallas de estado */
        .screen-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 10, 15, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .screen-title {
            font-size: 2.2rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0,242,255,0.3);
            font-weight: bold;
            text-align: center;
        }
        .action-btn {
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .action-btn:hover {
            background: var(--neon-blue);
            color: #050a0f;
            box-shadow: 0 0 15px var(--neon-blue);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="mission-panel" class="hud-panel">
        <div id="hud-level-title" style="font-size: 0.8em; color: var(--neon-pink); font-weight: bold;">NIVEL 1: CORE RECOVERY</div>
        <div id="stats">CHIPS: 0 / 5</div>
        <div id="status" style="font-size: 0.7em;">ESTADO: <span style="color: #0f0; font-weight: bold;">ONLINE</span></div>
    </div>

    <div id="health-panel" class="hud-panel">
        <div class="battery active"></div>
        <div class="battery active"></div>
        <div class="battery active"></div>
    </div>

    <div id="voice-panel-ui">
        <button class="voice-audit-btn" onclick="triggerVoiceAudit()">🎙️ AUDITAR SISTEMA</button>
    </div>

    <div id="start-screen" class="screen-overlay">
        <div class="screen-title">MAXIQUEEN OS<br><span style="font-size: 1.2rem; color: #fff;">CYBER MISSION INICIAL</span></div>
        <button class="action-btn" onclick="startGameLoop()">INICIAR INYECCIÓN</button>
    </div>

    <div id="next-level-screen" class="screen-overlay" style="display: none;">
        <div class="screen-title" id="next-level-title">NIVEL COMPLETADO</div>
        <button class="action-btn" onclick="advanceToNextLevel()">CARGAR SIGUIENTE SEGMENTO</button>
    </div>

    <div id="gameover-screen" class="screen-overlay" style="display: none;">
        <div class="screen-title" style="color: var(--error);">SISTEMA COMPROMETIDO<br><span style="font-size: 1rem; color: #aaa;">BATERÍAS AGOTADAS</span></div>
        <button class="action-btn" onclick="resetEntireGame()">REINICIAR NÚCLEO</button>
    </div>

    <div id="victory-screen" class="screen-overlay" style="display: none;">
        <div class="screen-title">¡MISIÓN EXITOSA!<br><span style="font-size: 1.1rem; color: var(--accent);">MÓDULOS REINTEGRADOS AL OS</span></div>
        <button class="action-btn" onclick="resetEntireGame()">VOLVER A EJECUTAR</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="controls">
        <div style="display: flex; gap: 15px;">
            <div class="btn" id="btnLeft">←</div>
            <div class="btn" id="btnRight">→</div>
        </div>
        <div class="btn" id="btnJump" style="border-radius: 12px; width: 110px; font-size: 16px;">SALTAR</div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = 800; canvas.height = 600;

    // Configuración Multinivel Estructurada
    const levelConfigurations = {
        1: {
            name: "NIVEL 1: CORE RECOVERY",
            requiredChips: 5,
            droneSpeed: 2.5,
            droneRange: 120,
            platforms: [
                { x: 0, y: 530, w: 800, h: 70 }, // Suelo Base
                { x: 150, y: 400, w: 200, h: 15 },
                { x: 450, y: 320, w: 220, h: 15 },
                { x: 250, y: 200, w: 180, h: 15 }
            ]
        },
        2: {
            name: "NIVEL 2: MATRIX BYPASS",
            requiredChips: 6,
            droneSpeed: 4.0,
            droneRange: 160,
            platforms: [
                { x: 0, y: 530, w: 800, h: 70 },
                { x: 80, y: 420, w: 140, h: 15 },
                { x: 300, y: 340, w: 200, h: 15 },
                { x: 580, y: 420, w: 140, h: 15 },
                { x: 200, y: 210, w: 400, h: 15 }
            ]
        },
        3: {
            name: "NIVEL 3: QUANTUM TERMINAL",
            requiredChips: 8,
            droneSpeed: 5.5,
            droneRange: 180,
            platforms: [
                { x: 0, y: 530, w: 800, h: 70 },
                { x: 50, y: 440, w: 120, h: 15 },
                { x: 220, y: 350, w: 120, h: 15 },
                { x: 420, y: 270, w: 120, h: 15 },
                { x: 600, y: 190, w: 150, h: 15 },
                { x: 150, y: 160, w: 180, h: 15 }
            ]
        }
    };

    let currentLevelIndex = 1;
    let gameState = {
        chipsCollected: 0,
        health: 3,
        mode: 'MENU', // MENU, PLAYING, SCREEN
        activeMessage: ""
    };

    const player = {
        x: 100, y: 450, radius: 16, color: "#00f2ff",
        velX: 0, velY: 0, speed: 5.5, jump: -15, gravity: 0.75, onGround: false
    };

    let chips = [];
    let drones = [];
    let currentPlatforms = [];

    // MOTOR NATIVO DE VOZ DE MAXIQUEEN OS (100% Local / Web Speech API)
    function speakSystemOS(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // Mitiga encadenamientos de voz retrasados
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = 1.05;
            utterance.pitch = 0.95; // Tono sutilmente tecnológico
            window.speechSynthesis.speak(utterance);
        }
    }

    function triggerVoiceAudit() {
        let conf = levelConfigurations[currentLevelIndex];
        let pending = conf.requiredChips - gameState.chipsCollected;
        let auditText = `Reporte del sistema MaxiQueen OS. Te encuentras en el ${conf.name}. Has recolectado ${gameState.chipsCollected} chips, quedan ${pending} pendientes. Estado de batería al ${gameState.health * 33.3}%`;
        speakSystemOS(auditText);
    }

    // Inicializar Configuración del Nivel
    function setupLevel(levelNumber) {
        const config = levelConfigurations[levelNumber];
        currentLevelIndex = levelNumber;
        gameState.chipsCollected = 0;
        
        document.getElementById("hud-level-title").innerText = config.name;
        document.getElementById("stats").innerText = `CHIPS: 0 / ${config.requiredChips}`;
        
        currentPlatforms = config.platforms;
        
        // Reset posición jugador
        player.x = 80;
        player.y = 450;
        player.velX = 0;
        player.velY = 0;

        // Distribución inteligente de Chips sobre plataformas
        chips = [];
        for(let i = 0; i < config.requiredChips; i++) {
            let plat = currentPlatforms[Math.floor(Math.random() * (currentPlatforms.length - 1)) + 1];
            chips.push({
                x: plat.x + Math.random() * (plat.w - 20) + 10,
                y: plat.y - 25,
                collected: false
            });
        }

        // Distribución de Drones Enemigos
        drones = [
            { x: 320, y: 250, range: config.droneRange, startY: 250, speed: config.droneSpeed },
            { x: 580, y: 300, range: config.droneRange, startY: 300, speed: -config.droneSpeed }
        ];
    }

    // Gestión de Controles e Input Polling
    const keys = {};
    const setKey = (code, value) => { keys[code] = value; };
    
    window.addEventListener("keydown", e => setKey(e.code, true));
    window.addEventListener("keyup", e => setKey(e.code, false));
    
    // Mapeo Táctil compatible con Móviles / Acode
    const bindTouchElement = (elementId, keyCode) => {
        const el = document.getElementById(elementId);
        el.addEventListener("touchstart", (e) => { e.preventDefault(); setKey(keyCode, true); });
        el.addEventListener("touchend", (e) => { e.preventDefault(); setKey(keyCode, false); });
        // Compatibilidad con Mouse en Desktop
        el.addEventListener("mousedown", () => setKey(keyCode, true));
        el.addEventListener("mouseup", () => setKey(keyCode, false));
    };

    bindTouchElement("btnLeft", "ArrowLeft");
    bindTouchElement("btnRight", "ArrowRight");
    bindTouchElement("btnJump", "Space");

    // Lógica de Inicio y Control de Pantallas
    function startGameLoop() {
        document.getElementById("start-screen").style.display = "none";
        gameState.mode = 'PLAYING';
        setupLevel(1);
        speakSystemOS("Inyectando secuencia central de MaxiQueen OS. Misión de recolección iniciada.");
    }

    function advanceToNextLevel() {
        document.getElementById("next-level-screen").style.display = "none";
        gameState.mode = 'PLAYING';
        setupLevel(currentLevelIndex + 1);
    }

    function resetEntireGame() {
        document.getElementById("gameover-screen").style.display = "none";
        document.getElementById("victory-screen").style.display = "none";
        
        // Restaurar Baterías HUD
        const batteries = document.querySelectorAll(".battery");
        batteries.forEach(b => b.classList.add("active"));
        
        gameState.health = 3;
        gameState.mode = 'PLAYING';
        setupLevel(1);
        speakSystemOS("Reconfigurando parámetros de inicio. Baterías cargadas.");
    }

    // Mecánica de Colisiones Cuadradas AABB para Plataformas
    function checkPlatformCollisions() {
        player.onGround = false;

        for (let plat of currentPlatforms) {
            // Verificar proximidad en el eje X
            if (player.x + player.radius - 4 > plat.x && player.x - player.radius + 4 < plat.x + plat.w) {
                // Verificar si cae sobre la superficie de la plataforma
                if (player.velY >= 0 && player.y + player.radius <= plat.y + 10 && player.y + player.radius + player.velY >= plat.y) {
                    player.y = plat.y - player.radius;
                    player.velY = 0;
                    player.onGround = true;
                    break;
                }
            }
        }
    }

    function update() {
        if (gameState.mode !== 'PLAYING') return;

        // Movimiento Cinemático Horizontal
        if (keys["ArrowLeft"]) player.velX = -player.speed;
        else if (keys["ArrowRight"]) player.velX = player.speed;
        else player.velX *= 0.78; // Fricción amortiguadora

        player.x += player.velX;

        // Límites Laterales del Canvas
        if (player.x - player.radius < 0) player.x = player.radius;
        if (player.x + player.radius > canvas.width) player.x = canvas.width - player.radius;

        // Salto Dinámico y Gravedad
        if (keys["Space"] && player.onGround) {
            player.velY = player.jump;
            player.onGround = false;
        }
        
        player.velY += player.gravity;
        player.y += player.velY;

        // Validar Físicas de Plataformas
        checkPlatformCollisions();

        // Colisión con Objetos (Chips de Datos)
        const config = levelConfigurations[currentLevelIndex];
        chips.forEach(c => {
            if (!c.collected && Math.hypot(player.x - c.x, player.y - c.y) < player.radius + 12) {
                c.collected = true;
                gameState.chipsCollected++;
                document.getElementById("stats").innerText = `CHIPS: ${gameState.chipsCollected} / ${config.requiredChips}`;
                
                if (gameState.chipsCollected === config.requiredChips) {
                    evaluateLevelProgression();
                }
            }
        });

        // Simulación y Movimiento de Patrullaje de Drones
        drones.forEach(d => {
            d.y += d.speed;
            if (Math.abs(d.y - d.startY) > d.range) d.speed *= -1; // Inversión vectorial de patrulla
            
            // Detección de Daño por Proximidad Radial
            if (Math.hypot(player.x - d.x, player.y - d.y) < player.radius + 14) {
                processDamageTrigger();
            }
        });
    }

    function processDamageTrigger() {
        gameState.health--;
        player.x = 80; 
        player.y = 450; // Reubicación táctica
        player.velX = 0;
        player.velY = 0;
        
        const batteries = document.querySelectorAll(".battery");
        if (batteries[gameState.health]) {
            batteries[gameState.health].classList.remove("active");
        }

        if (gameState.health <= 0) {
            gameState.mode = 'SCREEN';
            document.getElementById("gameover-screen").style.display = "flex";
            speakSystemOS("Alerta. Conectividad perdida. El sistema operativo ha colapsado.");
        } else {
            speakSystemOS(`Advertencia. Impacto detectado. Baterías al ${gameState.health} de tres.`);
        }
    }

    function evaluateLevelProgression() {
        if (levelConfigurations[currentLevelIndex + 1]) {
            gameState.mode = 'SCREEN';
            document.getElementById("next-level-title").innerText = `SEGMENTO ${currentLevelIndex} CONSOLIDADO`;
            document.getElementById("next-level-screen").style.display = "flex";
            speakSystemOS(`Segmento ${currentLevelIndex} recuperado de forma exitosa. Preparando salto de matriz.`);
        } else {
            gameState.mode = 'SCREEN';
            document.getElementById("victory-screen").style.display = "flex";
            speakSystemOS("Felicidades. Todos los sectores cuánticos han sido restaurados. MaxiQueen OS se encuentra estable.");
        }
    }

    function draw() {
        // Limpieza y Render de Fondo del Espacio de Trabajo
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Renderizado Estilizado de Plataformas Tecnológicas
        currentPlatforms.forEach((plat, index) => {
            if (index === 0) {
                ctx.fillStyle = "#111a2e"; // Suelo Principal
            } else {
                ctx.fillStyle = "#1e293b"; // Vigas Elevadas
            }
            ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            
            // Línea de Neón Superior de Guía Física
            ctx.strokeStyle = "#00f2ff";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(plat.x, plat.y);
            ctx.lineTo(plat.x + plat.w, plat.y);
            ctx.stroke();
        });

        // Dibujar Jugador (Esfera Central de Neón)
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();
        
        // Núcleo Blanco de Energía del Jugador
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius - 6, 0, Math.PI * 2);
        ctx.fill();

        // Dibujar Chips (Cubos Cuánticos de Datos)
        chips.forEach(c => {
            if (!c.collected) {
                ctx.fillStyle = "#ff00ff";
                ctx.fillRect(c.x - 9, c.y - 9, 18, 18);
                
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 1;
                ctx.strokeRect(c.x - 11, c.y - 11, 22, 22);
            }
        });

        // Dibujar Drones Hostiles (Triángulos de Seguridad)
        drones.forEach(d => {
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.moveTo(d.x, d.y - 14);
            ctx.lineTo(d.x + 14, d.y + 14);
            ctx.lineTo(d.x - 14, d.y + 14);
            ctx.closePath();
            ctx.fill();
            
            // Sensor de escaneo infrarrojo
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(d.x, d.y + 4, 3, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    // Bucle Core de Animación e Interferencia Operativa
    function mainGameLoop() {
        update();
        draw();
        requestAnimationFrame(mainGameLoop);
    }

    // Inicialización de Precarga de Voces para Navegadores de Escritorio / Android
    if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
    }

    mainGameLoop();
</script>
</body>
</html>
